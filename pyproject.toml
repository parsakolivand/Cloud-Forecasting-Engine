[project]
name = "cloud-forecasting-engine"
version = "0.1.0"
description = "Open forecasting engine for FinOps engineers: connect your cloud and get a 12-month cost forecast"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "altair>=5.0",
    "numpy>=1.26",
    "openpyxl>=3.1.5",
    "pandas>=2.1",
    "scipy>=1.11",
    "streamlit>=1.66",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
